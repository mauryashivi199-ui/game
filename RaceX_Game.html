<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RaceX — Play</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--neon:#00f5ff;--hot:#ff2d55;--gold:#ffd60a;--dark:#050a0e;--muted:#5a7a8a;--green:#00ff88;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--dark);font-family:'Rajdhani',sans-serif;overflow:hidden;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
  .screen{position:fixed;inset:0;z-index:100;background:rgba(5,10,14,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
  .logo{font-family:'Orbitron',sans-serif;font-size:2.8rem;font-weight:900;color:var(--neon);text-shadow:0 0 28px var(--neon);letter-spacing:6px;}
  .logo span{color:var(--hot);}
  .av-row{display:flex;gap:10px;}
  .av{width:52px;height:52px;border-radius:50%;border:2px solid rgba(0,245,255,.18);background:#0f1e2e;display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;transition:all .2s;}
  .av:hover{border-color:rgba(0,245,255,.5);transform:scale(1.08);}
  .av.sel{border-color:var(--neon);background:rgba(0,245,255,.1);box-shadow:0 0 16px rgba(0,245,255,.35);}
  .name-inp{padding:12px 20px;background:#050a0e;border:1px solid rgba(0,245,255,.25);border-radius:8px;color:#e0f4ff;font-family:'Rajdhani',sans-serif;font-size:1rem;outline:none;text-align:center;width:280px;letter-spacing:1px;}
  .name-inp:focus{border-color:var(--neon);}
  .name-inp::placeholder{color:rgba(90,122,138,.5);}
  .hint{background:rgba(0,245,255,.05);border:1px solid rgba(0,245,255,.15);border-radius:10px;padding:12px 24px;text-align:center;color:#aaa;font-size:.88rem;line-height:1.9;max-width:340px;}
  .hint strong{color:var(--neon);}
  .btn{padding:14px 44px;border:none;border-radius:8px;font-family:'Orbitron',sans-serif;font-size:.92rem;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .2s;}
  .btn-hot{background:linear-gradient(135deg,var(--hot),#ff6b35);color:#fff;}
  .btn-hot:hover{box-shadow:0 0 32px rgba(255,45,85,.5);transform:translateY(-2px);}
  .btn-out{background:transparent;color:var(--neon);border:2px solid var(--neon);}
  .btn-out:hover{background:rgba(0,245,255,.08);}
  .go-big{font-size:4.5rem;animation:bounce .7s ease-in-out infinite alternate;}
  @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-14px)}}
  .go-title{font-family:'Orbitron',sans-serif;font-size:2.8rem;color:var(--hot);text-shadow:0 0 28px var(--hot);}
  .go-score{font-family:'Orbitron',sans-serif;font-size:1.4rem;color:var(--gold);}
  .go-best{color:var(--muted);font-size:.95rem;}
  .go-btns{display:flex;gap:14px;margin-top:6px;}
  #hud{position:fixed;top:0;left:0;right:0;z-index:50;display:none;justify-content:space-between;align-items:center;padding:11px 22px;background:rgba(5,10,14,.85);backdrop-filter:blur(10px);border-bottom:1px solid rgba(0,245,255,.12);}
  #hud.on{display:flex;}
  .hud-lbl{font-size:.58rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
  .hud-val{font-family:'Orbitron',sans-serif;font-size:1.2rem;color:var(--neon);}
  .hud-val.spd{color:var(--gold);}.hud-val.lv{color:var(--green);}.hud-val.hp{color:var(--hot);font-size:1rem;}
  .hud-name{font-family:'Orbitron',sans-serif;font-size:.88rem;color:var(--neon);}
  canvas{display:block;}
  #mobCtrl{position:fixed;bottom:18px;left:0;right:0;z-index:60;display:none;justify-content:center;gap:16px;}
  @media(max-width:600px){#mobCtrl{display:flex;}}
  .mob{width:68px;height:68px;border-radius:50%;background:rgba(0,245,255,.1);border:2px solid rgba(0,245,255,.35);color:var(--neon);font-size:1.7rem;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;}
  .mob:active{background:rgba(0,245,255,.25);}
  #backBtn{position:fixed;top:14px;left:18px;z-index:200;display:none;background:rgba(0,245,255,.08);border:1px solid rgba(0,245,255,.25);color:var(--neon);padding:7px 16px;border-radius:6px;font-family:'Orbitron',sans-serif;font-size:.68rem;letter-spacing:1px;cursor:pointer;}
  #backBtn.on{display:block;}
  #pauseBtn{position:fixed;top:14px;right:66px;z-index:200;display:none;background:rgba(0,245,255,.08);border:1px solid rgba(0,245,255,.25);color:var(--neon);padding:7px 16px;border-radius:6px;font-family:'Orbitron',sans-serif;font-size:.68rem;letter-spacing:1px;cursor:pointer;}
  #pauseBtn.on{display:block;}
  #muteBtn{position:fixed;top:14px;right:18px;z-index:200;display:none;background:rgba(0,245,255,.08);border:1px solid rgba(0,245,255,.25);color:var(--neon);padding:7px 12px;border-radius:6px;font-size:1rem;cursor:pointer;}
  #muteBtn.on{display:block;}
  #pauseScreen{display:none;position:fixed;inset:0;z-index:150;background:rgba(5,10,14,.9);backdrop-filter:blur(10px);align-items:center;justify-content:center;flex-direction:column;gap:20px;}
  #pauseScreen.on{display:flex;}
  .pause-title{font-family:'Orbitron',sans-serif;font-size:2.5rem;color:var(--gold);letter-spacing:4px;}
</style>
</head>
<body>

<div class="screen" id="screenStart">
  <div style="font-size:3.8rem;animation:bounce .8s ease-in-out infinite alternate">🏎️</div>
  <div class="logo">RACE<span>X</span></div>
  <div style="color:var(--muted);font-size:.88rem;letter-spacing:3px">FAST · FURIOUS · ONLINE</div>
  <div>
    <div style="font-size:.7rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;text-align:center">Choose Your Racer</div>
    <div class="av-row">
      <div class="av sel" onclick="selAv(this,'👩')">👩</div>
      <div class="av" onclick="selAv(this,'👩‍🦱')">👩‍🦱</div>
      <div class="av" onclick="selAv(this,'🧑')">🧑</div>
      <div class="av" onclick="selAv(this,'👨')">👨</div>
      <div class="av" onclick="selAv(this,'👩‍🦳')">👩‍🦳</div>
    </div>
  </div>
  <input class="name-inp" id="nameInp" type="text" placeholder="Enter racer name..." maxlength="16">
  <div class="hint">
    <strong>⬅ ➡</strong> Arrow / A D — Lane change<br>
    <strong>⬆</strong> W / Up — Boost (100 pts) &nbsp;|&nbsp; Collect ⚡ free turbo!
  </div>
  <button class="btn btn-hot" onclick="startGame()">🚀 START RACING</button>
  <a href="invite.html" style="color:var(--neon);font-family:'Orbitron',sans-serif;font-size:.7rem;letter-spacing:2px;text-decoration:none">👥 Invite Friends →</a>
</div>

<div class="screen" id="screenOver" style="display:none">
  <div class="go-big">💥</div>
  <div class="go-title">GAME OVER</div>
  <div class="go-score" id="goScore">Score: 0</div>
  <div class="go-best" id="goBest">Best: 0</div>
  <div class="go-btns">
    <button class="btn btn-hot" onclick="restartGame()">🔄 Race Again</button>
    <button class="btn btn-out" onclick="goHome()">🏠 Home</button>
  </div>
</div>

<div id="pauseScreen">
  <div class="pause-title">⏸ PAUSED</div>
  <button class="btn btn-hot" onclick="togglePause()">▶ Resume</button>
  <button class="btn btn-out" onclick="goHome()">🏠 Home</button>
</div>

<div id="hud">
  <div><div class="hud-lbl">Score</div><div class="hud-val" id="hudScore">0</div></div>
  <div><div class="hud-lbl">Speed</div><div class="hud-val spd" id="hudSpeed">0 km/h</div></div>
  <div class="hud-name" id="hudName">ShiviRacer</div>
  <div><div class="hud-lbl">Level</div><div class="hud-val lv" id="hudLevel">1</div></div>
  <div><div class="hud-lbl">Lives</div><div class="hud-val hp" id="hudLives">❤️❤️❤️</div></div>
</div>

<canvas id="c"></canvas>

<div id="mobCtrl">
  <div class="mob" id="mLeft">◀</div>
  <div class="mob" id="mBoost">⚡</div>
  <div class="mob" id="mRight">▶</div>
</div>
<button id="backBtn" onclick="goHome()">← Menu</button>
<button id="pauseBtn" onclick="togglePause()">⏸</button>
<button id="muteBtn" onclick="toggleMute()">🔊</button>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resize();
window.addEventListener('resize',()=>{resize();calcRoad();resetPos();initLines();});

// ── STATE ──
let gameRunning=false,paused=false;
let score=0,bestScore=+(localStorage.getItem('racex_best')||0);
let lives=3,level=1,frame=0;
let gameSpeed=3,targetSpeed=3;       // smooth speed system
const SPD_START=3,SPD_MAX=11;
let boosting=false,boostTimer=0;
let invincible=false,invincTimer=0;
let playerName=localStorage.getItem('racex_user')||'ShiviRacer';
let playerEmoji='👩';

// ── ROAD ──
const LANES=3;
let ROAD_W,ROAD_X,LANE_W;
function calcRoad(){ROAD_W=Math.min(canvas.width*.62,380);ROAD_X=(canvas.width-ROAD_W)/2;LANE_W=ROAD_W/LANES;}
calcRoad();

// ── PLAYER ──
let player={lane:1,x:0,y:0,w:52,h:78};
function resetPos(){player.y=canvas.height-160;player.x=ROAD_X+player.lane*LANE_W+LANE_W/2-player.w/2;}
resetPos();

let obstacles=[],powerups=[],particles=[],popups=[],roadLines=[];
function initLines(){roadLines=[];for(let i=0;i<14;i++)roadLines.push({y:i*(canvas.height/14)});}
initLines();

const ENEMIES=['🚗','🚕','🚙','🚌','🛻','🚐'];
function spawnOb(){const l=Math.floor(Math.random()*LANES);obstacles.push({lane:l,y:-90,w:48,h:74,speed:gameSpeed+Math.random()*1.8,emoji:ENEMIES[Math.floor(Math.random()*ENEMIES.length)]});}
function spawnPu(){powerups.push({lane:Math.floor(Math.random()*LANES),y:-42,w:36,h:36,emoji:'⚡'});}
function explode(x,y){for(let i=0;i<16;i++)particles.push({x,y,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,life:1,decay:.035+Math.random()*.04,size:4+Math.random()*10,color:['#ff2d55','#ffd60a','#ff6b35','#fff','#ffaaaa'][Math.floor(Math.random()*5)]});}
function popup(t,x,y,c='#ffd60a'){popups.push({txt:t,x,y,life:1,col:c,vy:-2.5});}

// ── DRAW ROAD ──
function drawRoad(){
  const bg=ctx.createLinearGradient(0,0,0,canvas.height);
  bg.addColorStop(0,'#010609');bg.addColorStop(1,'#071525');
  ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);

  // side verge green
  ctx.fillStyle='#0b1d14';
  ctx.fillRect(0,0,ROAD_X,canvas.height);
  ctx.fillRect(ROAD_X+ROAD_W,0,canvas.width-(ROAD_X+ROAD_W),canvas.height);

  // moving trees
  ctx.fillStyle='rgba(0,180,60,.14)';
  for(let i=0;i<8;i++){
    const yp=(i*110+(frame*gameSpeed*.4)%110);
    ctx.beginPath();ctx.arc(ROAD_X-22,yp,13,0,Math.PI*2);ctx.fill();
    ctx.fillRect(ROAD_X-26,yp,7,38);
    ctx.beginPath();ctx.arc(ROAD_X+ROAD_W+22,yp+55,13,0,Math.PI*2);ctx.fill();
    ctx.fillRect(ROAD_X+ROAD_W+19,yp+55,7,38);
  }

  // road — lighter for car contrast
  const rg=ctx.createLinearGradient(ROAD_X,0,ROAD_X+ROAD_W,0);
  rg.addColorStop(0,'#1c3040');rg.addColorStop(.5,'#243848');rg.addColorStop(1,'#1c3040');
  ctx.fillStyle=rg;ctx.fillRect(ROAD_X,0,ROAD_W,canvas.height);

  // neon borders
  ctx.save();ctx.shadowColor='#00f5ff';ctx.shadowBlur=22;
  ctx.strokeStyle='rgba(0,245,255,.9)';ctx.lineWidth=3;ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(ROAD_X,0);ctx.lineTo(ROAD_X,canvas.height);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ROAD_X+ROAD_W,0);ctx.lineTo(ROAD_X+ROAD_W,canvas.height);ctx.stroke();
  ctx.restore();

  // lane dividers
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=2;ctx.setLineDash([36,24]);
  for(let l=1;l<LANES;l++){const lx=ROAD_X+l*LANE_W;ctx.beginPath();ctx.moveTo(lx,0);ctx.lineTo(lx,canvas.height);ctx.stroke();}
  ctx.setLineDash([]);

  // road stripes
  ctx.fillStyle='rgba(255,255,255,.1)';
  roadLines.forEach(ln=>{ctx.fillRect(ROAD_X+16,ln.y,ROAD_W-32,5);ln.y+=gameSpeed*(boosting?1.9:1);if(ln.y>canvas.height)ln.y=-28;});
}

// ── DRAW CAR bright ──
function drawCar(emoji,x,y,w,h,glowCol,glowStr){
  ctx.save();
  // bright halo under car
  const bg=ctx.createRadialGradient(x+w/2,y+h*.6,2,x+w/2,y+h*.6,w*.65);
  bg.addColorStop(0,'rgba(255,255,255,0.16)');bg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=bg;ctx.beginPath();ctx.ellipse(x+w/2,y+h*.6,w*.6,h*.42,0,0,Math.PI*2);ctx.fill();
  // glow + emoji double draw
  ctx.shadowColor=glowCol;ctx.shadowBlur=glowStr;
  ctx.font=`${w+6}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(emoji,x+w/2,y+h/2);
  ctx.shadowBlur=0;
  ctx.font=`${w+2}px serif`;
  ctx.fillText(emoji,x+w/2,y+h/2);
  ctx.restore();
}

// ── DRAW PLAYER ──
function drawPlayer(){
  if(invincible&&Math.floor(invincTimer*14)%2===0)return;
  const gc=boosting?'#ffd60a':'#ffffff';
  drawCar(playerEmoji,player.x,player.y,player.w,player.h,gc,boosting?50:36);
  // headlights
  ctx.save();ctx.shadowColor=boosting?'#ffd60a':'#fffff0';ctx.shadowBlur=22;
  ctx.fillStyle=boosting?'rgba(255,220,40,1)':'rgba(255,255,210,1)';
  ctx.beginPath();ctx.ellipse(player.x+11,player.y+6,6,3.5,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(player.x+player.w-11,player.y+6,6,3.5,0,0,Math.PI*2);ctx.fill();
  // under-glow strip
  const sg=ctx.createLinearGradient(player.x,0,player.x+player.w,0);
  sg.addColorStop(0,'transparent');sg.addColorStop(.5,boosting?'rgba(255,214,10,.55)':'rgba(0,245,255,.4)');sg.addColorStop(1,'transparent');
  ctx.fillStyle=sg;ctx.shadowBlur=0;ctx.fillRect(player.x+4,player.y+player.h-3,player.w-8,3);
  ctx.restore();
  // boost flame
  if(boosting){ctx.save();ctx.shadowColor='#ff6b00';ctx.shadowBlur=25;ctx.fillStyle='rgba(255,110,0,.8)';ctx.beginPath();ctx.ellipse(player.x+player.w/2,player.y+player.h+14,13,26,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,220,30,.6)';ctx.beginPath();ctx.ellipse(player.x+player.w/2,player.y+player.h+7,7,14,0,0,Math.PI*2);ctx.fill();ctx.restore();}
}

// ── DRAW OBSTACLES ──
function drawObstacles(){
  obstacles.forEach(ob=>{
    const ox=ROAD_X+ob.lane*LANE_W+LANE_W/2-ob.w/2;ob._x=ox;
    drawCar(ob.emoji,ox,ob.y,ob.w,ob.h,'#ff5566',24);
    ctx.save();ctx.shadowColor='#ff2d55';ctx.shadowBlur=14;ctx.fillStyle='rgba(255,55,55,.95)';
    ctx.beginPath();ctx.ellipse(ox+10,ob.y+ob.h-6,5,3,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(ox+ob.w-10,ob.y+ob.h-6,5,3,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
}

// ── DRAW POWERUPS ──
function drawPowerups(){
  powerups.forEach(pu=>{
    const px=ROAD_X+pu.lane*LANE_W+LANE_W/2-pu.w/2;pu._x=px;
    ctx.save();ctx.shadowColor='#ffd60a';ctx.shadowBlur=30;
    const p=.5+.5*Math.sin(frame*.15);
    ctx.strokeStyle=`rgba(255,214,10,${.4+p*.5})`;ctx.lineWidth=2.5;ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(px+pu.w/2,pu.y+pu.h/2,pu.w/2+8,0,Math.PI*2);ctx.stroke();
    ctx.font='32px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(pu.emoji,px+pu.w/2,pu.y+pu.h/2);ctx.restore();
  });
}

// ── FX ──
function drawFX(){
  particles.forEach(p=>{ctx.save();ctx.globalAlpha=p.life;ctx.shadowColor=p.color;ctx.shadowBlur=10;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.restore();p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;});
  particles=particles.filter(p=>p.life>0);
  popups.forEach(p=>{ctx.save();ctx.globalAlpha=p.life;ctx.shadowColor=p.col;ctx.shadowBlur=14;ctx.fillStyle=p.col;ctx.font="bold 22px 'Orbitron',sans-serif";ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.txt,p.x,p.y);ctx.restore();p.y+=p.vy;p.life-=.024;});
  popups=popups.filter(p=>p.life>0);
  if(boosting){const pct=boostTimer/180;ctx.fillStyle='rgba(255,214,10,.1)';ctx.fillRect(ROAD_X,canvas.height-10,ROAD_W,10);const bg=ctx.createLinearGradient(ROAD_X,0,ROAD_X+ROAD_W*pct,0);bg.addColorStop(0,'#ff6b00');bg.addColorStop(1,'#ffd60a');ctx.save();ctx.shadowColor='#ffd60a';ctx.shadowBlur=14;ctx.fillStyle=bg;ctx.fillRect(ROAD_X,canvas.height-10,ROAD_W*pct,10);ctx.restore();}
}

// ── COLLISION ──
function overlap(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}
function checkHits(){
  if(invincible)return;
  obstacles.forEach((ob,i)=>{if(!ob._x)return;if(overlap(player.x+8,player.y+8,player.w-16,player.h-16,ob._x+8,ob.y+8,ob.w-16,ob.h-16)){explode(player.x+player.w/2,player.y+player.h/2);obstacles.splice(i,1);lives--;invincible=true;invincTimer=2.5;snd('crash');updateHUD();if(lives<=0)endGame();}});
  powerups.forEach((pu,i)=>{if(!pu._x)return;if(overlap(player.x,player.y,player.w,player.h,pu._x,pu.y,pu.w,pu.h)){powerups.splice(i,1);boosting=true;boostTimer=180;score+=50;popup('⚡ TURBO!',player.x+player.w/2,player.y-10,'#ffd60a');snd('powerup');}});
}

// ── INPUT ──
const keys={};const mob={l:false,r:false,b:false};
document.addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowLeft','ArrowRight','ArrowUp','KeyA','KeyD','KeyW','Space'].includes(e.code))e.preventDefault();if(e.code==='Space'||e.code==='Escape')togglePause();});
document.addEventListener('keyup',e=>keys[e.code]=false);
let laneTarget=1,laneCD=0,lastLane=1;
function handleInput(){
  if(laneCD>0){laneCD--;return;}
  if((keys['ArrowLeft']||keys['KeyA']||mob.l)&&laneTarget>0){laneTarget--;laneCD=14;}
  if((keys['ArrowRight']||keys['KeyD']||mob.r)&&laneTarget<LANES-1){laneTarget++;laneCD=14;}
  if(laneTarget!==lastLane){snd('lanechange');lastLane=laneTarget;}
  if((keys['ArrowUp']||keys['KeyW']||mob.b)&&!boosting&&score>=100){boosting=true;boostTimer=130;score-=100;popup('⚡ BOOST!',player.x+player.w/2,player.y-10,'#ffd60a');snd('boost');}
}
function slide(){const tx=ROAD_X+laneTarget*LANE_W+LANE_W/2-player.w/2;player.x+=(tx-player.x)*.2;}

document.getElementById('mLeft').addEventListener('touchstart',e=>{mob.l=true;e.preventDefault();},{passive:false});
document.getElementById('mLeft').addEventListener('touchend',()=>mob.l=false);
document.getElementById('mRight').addEventListener('touchstart',e=>{mob.r=true;e.preventDefault();},{passive:false});
document.getElementById('mRight').addEventListener('touchend',()=>mob.r=false);
document.getElementById('mBoost').addEventListener('touchstart',e=>{mob.b=true;e.preventDefault();},{passive:false});
document.getElementById('mBoost').addEventListener('touchend',()=>mob.b=false);

// ── HUD ──
function updateHUD(){
  document.getElementById('hudScore').textContent=score;
  document.getElementById('hudSpeed').textContent=Math.floor(gameSpeed*30)+' km/h';
  document.getElementById('hudLevel').textContent=level;
  document.getElementById('hudName').textContent=playerName;
  const h=['','❤️','❤️❤️','❤️❤️❤️'];
  document.getElementById('hudLives').textContent=h[Math.max(0,lives)]||'💀';
}

// ── GAME LOOP ──
function loop(){
  if(!gameRunning||paused)return;
  frame++;
  handleInput();slide();
  if(boosting){boostTimer--;if(boostTimer<=0)boosting=false;}
  if(invincible){invincTimer-=1/60;if(invincTimer<=0)invincible=false;}

  // SMOOTH SPEED — tiny increase every second, lerp toward target
  if(frame%60===0&&targetSpeed<SPD_MAX) targetSpeed=Math.min(SPD_MAX,targetSpeed+0.06);
  gameSpeed+=(targetSpeed-gameSpeed)*0.003;  // very gentle lerp

  // level up every 800 frames — no sudden jump
  if(frame%800===0){level++;targetSpeed=Math.min(SPD_MAX,SPD_START+level*.4);popup('⬆ LEVEL '+level+'!',canvas.width/2,canvas.height/2,'#00f5ff');snd('levelup');}

  const sr=Math.max(42,95-level*6);
  if(frame%sr===0)spawnOb();
  if(frame%320===0)spawnPu();
  if(frame%10===0)score++;

  obstacles.forEach(ob=>ob.y+=ob.speed*(boosting?1.85:1));
  obstacles=obstacles.filter(ob=>ob.y<canvas.height+110);
  powerups.forEach(pu=>pu.y+=gameSpeed*.65);
  powerups=powerups.filter(pu=>pu.y<canvas.height+60);

  checkHits();updateHUD();updateEngineSnd();
  drawRoad();drawObstacles();drawPowerups();drawPlayer();drawFX();
  requestAnimationFrame(loop);
}

// ── CONTROLS ──
function selAv(el,emoji){document.querySelectorAll('.av').forEach(a=>a.classList.remove('sel'));el.classList.add('sel');playerEmoji=emoji;}

function startGame(){
  const nm=document.getElementById('nameInp').value.trim();
  if(nm)playerName=nm;
  localStorage.setItem('racex_user',playerName);
  calcRoad();resetPos();initLines();
  obstacles=[];powerups=[];particles=[];popups=[];
  score=0;lives=3;level=1;frame=0;
  gameSpeed=SPD_START;targetSpeed=SPD_START;
  boosting=false;boostTimer=0;laneTarget=1;laneCD=0;
  invincible=false;invincTimer=0;lastLane=1;
  document.getElementById('screenStart').style.display='none';
  document.getElementById('screenOver').style.display='none';
  document.getElementById('hud').classList.add('on');
  document.getElementById('backBtn').classList.add('on');
  document.getElementById('pauseBtn').classList.add('on');
  document.getElementById('muteBtn').classList.add('on');
  document.getElementById('mobCtrl').style.display='flex';
  gameRunning=true;startEngine();loop();
}

function restartGame(){
  calcRoad();resetPos();initLines();
  obstacles=[];powerups=[];particles=[];popups=[];
  score=0;lives=3;level=1;frame=0;
  gameSpeed=SPD_START;targetSpeed=SPD_START;
  boosting=false;boostTimer=0;laneTarget=1;laneCD=0;
  invincible=false;invincTimer=0;lastLane=1;
  document.getElementById('screenOver').style.display='none';
  gameRunning=true;startEngine();loop();
}

function endGame(){
  gameRunning=false;stopEngine();snd('gameover');
  if(score>bestScore){bestScore=score;localStorage.setItem('racex_best',bestScore);}
  document.getElementById('goScore').textContent='Score: '+score;
  document.getElementById('goBest').textContent='Best: '+bestScore;
  document.getElementById('screenOver').style.display='flex';
  document.getElementById('pauseBtn').classList.remove('on');
}

function goHome(){
  gameRunning=false;paused=false;stopEngine();
  document.getElementById('screenStart').style.display='flex';
  document.getElementById('screenOver').style.display='none';
  document.getElementById('pauseScreen').classList.remove('on');
  document.getElementById('hud').classList.remove('on');
  document.getElementById('backBtn').classList.remove('on');
  document.getElementById('pauseBtn').classList.remove('on');
  document.getElementById('muteBtn').classList.remove('on');
  document.getElementById('mobCtrl').style.display='none';
  document.getElementById('nameInp').value=playerName;
}

function togglePause(){
  if(!gameRunning&&!paused)return;
  paused=!paused;
  document.getElementById('pauseScreen').classList.toggle('on',paused);
  document.getElementById('pauseBtn').textContent=paused?'▶':'⏸';
  if(paused)stopEngine();else{startEngine();loop();}
}

// ════════════════════════════════
//   REAL RACING SOUND ENGINE
// ════════════════════════════════
let AC=null,soundOn=true;
let engOscs=[],engGain=null,engLFO=null;

function getAC(){
  if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  return AC;
}

// deep layered engine
function startEngine(){
  if(!soundOn)return;
  stopEngine();
  const ac=getAC();
  engGain=ac.createGain();
  engGain.gain.setValueAtTime(0.001,ac.currentTime);
  engGain.gain.linearRampToValueAtTime(0.09,ac.currentTime+0.5);
  engGain.connect(ac.destination);

  // waveshaper distortion = growl
  const dist=ac.createWaveShaper();
  const curve=new Float32Array(256);
  for(let i=0;i<256;i++){const x=i*2/256-1;curve[i]=x<0?-Math.pow(-x,.65):Math.pow(x,.65);}
  dist.curve=curve;dist.oversample='4x';dist.connect(engGain);

  // osc1: deep sawtooth — cylinder rumble
  const o1=ac.createOscillator();o1.type='sawtooth';o1.frequency.value=55;
  const g1=ac.createGain();g1.gain.value=0.65;o1.connect(g1);g1.connect(dist);o1.start();

  // osc2: square — mid harmonic
  const o2=ac.createOscillator();o2.type='square';o2.frequency.value=110;
  const g2=ac.createGain();g2.gain.value=0.28;o2.connect(g2);g2.connect(dist);o2.start();

  // osc3: high sawtooth — valve whine
  const o3=ac.createOscillator();o3.type='sawtooth';o3.frequency.value=220;
  const g3=ac.createGain();g3.gain.value=0.12;o3.connect(g3);g3.connect(dist);o3.start();

  // noise: exhaust hiss
  const bufSz=ac.sampleRate*.5;
  const buf=ac.createBuffer(1,bufSz,ac.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<bufSz;i++)d[i]=Math.random()*2-1;
  const noise=ac.createBufferSource();noise.buffer=buf;noise.loop=true;
  const nf=ac.createBiquadFilter();nf.type='bandpass';nf.frequency.value=1100;nf.Q.value=0.4;
  const ng=ac.createGain();ng.gain.value=0.05;
  noise.connect(nf);nf.connect(ng);ng.connect(engGain);noise.start();

  // LFO: RPM wobble
  engLFO=ac.createOscillator();engLFO.type='sine';engLFO.frequency.value=7;
  const lfoG=ac.createGain();lfoG.gain.value=9;
  engLFO.connect(lfoG);lfoG.connect(o1.frequency);lfoG.connect(o2.frequency);
  engLFO.start();

  engOscs=[o1,o2,o3,noise,engLFO];
}

function stopEngine(){
  engOscs.forEach(o=>{try{o.stop();}catch(e){}});
  engOscs=[];
  if(engGain){engGain.disconnect();engGain=null;}
}

function updateEngineSnd(){
  if(!engOscs.length||!engGain||!soundOn)return;
  const ac=getAC();
  const spd=boosting?gameSpeed*1.8:gameSpeed;
  const base=55+spd*17;
  engOscs[0].frequency.setTargetAtTime(base,ac.currentTime,0.06);
  engOscs[1].frequency.setTargetAtTime(base*2,ac.currentTime,0.06);
  engOscs[2].frequency.setTargetAtTime(base*4,ac.currentTime,0.06);
  if(engLFO)engLFO.frequency.setTargetAtTime(5+spd*0.9,ac.currentTime,0.08);
  engGain.gain.setTargetAtTime(boosting?0.16:0.09,ac.currentTime,0.08);
}

// one-shot sounds
function snd(type){
  if(!soundOn)return;
  const ac=getAC();
  const out=ac.createGain();out.connect(ac.destination);

  if(type==='crash'){
    // BOOM
    const b=ac.createOscillator();b.type='sine';
    b.frequency.setValueAtTime(130,ac.currentTime);
    b.frequency.exponentialRampToValueAtTime(22,ac.currentTime+.55);
    const bg=ac.createGain();bg.gain.setValueAtTime(.85,ac.currentTime);bg.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.55);
    b.connect(bg);bg.connect(out);b.start();b.stop(ac.currentTime+.55);
    // SCREECH
    const nbuf=ac.createBuffer(1,ac.sampleRate*.25,ac.sampleRate);
    const nd=nbuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*Math.pow(1-i/nd.length,.4);
    const ns=ac.createBufferSource();ns.buffer=nbuf;
    const nf=ac.createBiquadFilter();nf.type='bandpass';nf.frequency.value=3200;nf.Q.value=1.5;
    const ng=ac.createGain();ng.gain.value=.55;
    ns.connect(nf);nf.connect(ng);ng.connect(out);ns.start();
    // METAL
    const m=ac.createOscillator();m.type='sawtooth';m.frequency.value=900;
    const mg=ac.createGain();mg.gain.setValueAtTime(.28,ac.currentTime);mg.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.12);
    m.connect(mg);mg.connect(out);m.start();m.stop(ac.currentTime+.12);
  }

  else if(type==='boost'){
    // turbo whoosh — rising
    const w=ac.createOscillator();w.type='sawtooth';
    w.frequency.setValueAtTime(70,ac.currentTime);
    w.frequency.exponentialRampToValueAtTime(700,ac.currentTime+.55);
    const wg=ac.createGain();wg.gain.setValueAtTime(.01,ac.currentTime);wg.gain.linearRampToValueAtTime(.38,ac.currentTime+.15);wg.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.58);
    w.connect(wg);wg.connect(out);w.start();w.stop(ac.currentTime+.58);
    // tyre spin
    const tb=ac.createBuffer(1,ac.sampleRate*.3,ac.sampleRate);
    const td=tb.getChannelData(0);for(let i=0;i<td.length;i++)td[i]=Math.random()*2-1;
    const ts=ac.createBufferSource();ts.buffer=tb;
    const tf=ac.createBiquadFilter();tf.type='highpass';tf.frequency.value=2500;
    const tg=ac.createGain();tg.gain.setValueAtTime(.22,ac.currentTime);tg.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);
    ts.connect(tf);tf.connect(tg);tg.connect(out);ts.start();
  }

  else if(type==='powerup'){
    [523,659,784,1047,1319].forEach((f,i)=>{
      const o=ac.createOscillator();o.type='sine';o.frequency.value=f;
      const g=ac.createGain();
      g.gain.setValueAtTime(0,ac.currentTime+i*.07);
      g.gain.linearRampToValueAtTime(.28,ac.currentTime+i*.07+.03);
      g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.07+.2);
      o.connect(g);g.connect(out);o.start(ac.currentTime+i*.07);o.stop(ac.currentTime+i*.07+.2);
    });
  }

  else if(type==='levelup'){
    // F1 victory horn
    [392,494,587,784].forEach((f,i)=>{
      const o=ac.createOscillator();o.type='square';o.frequency.value=f;
      const g=ac.createGain();
      g.gain.setValueAtTime(0,ac.currentTime+i*.12);
      g.gain.linearRampToValueAtTime(.22,ac.currentTime+i*.12+.04);
      g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.12+.38);
      o.connect(g);g.connect(out);o.start(ac.currentTime+i*.12);o.stop(ac.currentTime+i*.12+.38);
    });
  }

  else if(type==='gameover'){
    // engine dying
    const d=ac.createOscillator();d.type='sawtooth';
    d.frequency.setValueAtTime(280,ac.currentTime);
    d.frequency.exponentialRampToValueAtTime(30,ac.currentTime+1.4);
    const dg=ac.createGain();dg.gain.setValueAtTime(.45,ac.currentTime);dg.gain.exponentialRampToValueAtTime(.001,ac.currentTime+1.4);
    d.connect(dg);dg.connect(out);d.start();d.stop(ac.currentTime+1.4);
  }

  else if(type==='lanechange'){
    // tyre squeak
    const tb=ac.createBuffer(1,ac.sampleRate*.07,ac.sampleRate);
    const td=tb.getChannelData(0);for(let i=0;i<td.length;i++)td[i]=(Math.random()*2-1)*Math.pow(1-i/td.length,.3);
    const ts=ac.createBufferSource();ts.buffer=tb;
    const tf=ac.createBiquadFilter();tf.type='bandpass';tf.frequency.value=2600;tf.Q.value=2;
    const tg=ac.createGain();tg.gain.value=.2;
    ts.connect(tf);tf.connect(tg);tg.connect(out);ts.start();
  }
}

function toggleMute(){
  soundOn=!soundOn;
  document.getElementById('muteBtn').textContent=soundOn?'🔊':'🔇';
  document.getElementById('muteBtn').style.opacity=soundOn?'1':'.5';
  if(!soundOn)stopEngine();
  else if(gameRunning&&!paused)startEngine();
}
