<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invite Friends</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="invite-body">

<div class="invite-box">
  <h1>👥 Create Racing Room</h1>

  <input type="text" placeholder="Room Name">

  <button onclick="generateCode()">Generate Room Code</button>

  <h2 id="roomCode"></h2>

  <a href="game.html">
    <button class="start-btn">Start Race</button>
  </a>
</div>

<script>
function generateCode(){
  let code = Math.floor(Math.random()*999999);
  document.getElementById("roomCode").innerHTML = "Room Code: " + code;
}
</script>

</body>
</html>
