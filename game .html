<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="game-body">

<div class="gameArea">

  <div class="roadLine" style="top:0px"></div>
  <div class="roadLine" style="top:200px"></div>
  <div class="roadLine" style="top:400px"></div>

  <img src="images/car.png" class="car" id="car">

</div>

<div class="score-box">
  Score: <span id="score">0</span>
</div>

<audio id="engine" loop>
  <source src="sounds/engine.mp3" type="audio/mp3">
</audio>

<audio id="crash">
  <source src="sounds/crash.mp3" type="audio/mp3">
</audio>

<script src="game.js"></script>
</body>
</html>
